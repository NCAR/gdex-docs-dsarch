name: pgrst

on:
  workflow_dispatch:

jobs:
  pgrst:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install required packages
        run: pip install -r docs/requirements.txt

      - name: Remove existing index.rst
        run: rm -f docs/source/index.rst

      - name: Regenerate RST files
        run: pgrst dsarch

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/source/index.rst docs/source/section*.rst
          git diff --cached --quiet || git commit -m "Regenerate RST files via pgrst dsarch"
          git push
