# work flow to convert dsarch.usg in repo rda_python_dsarch into docs/source/sections*.rst
on:
  repository_dispatch:
    types: [trigger-conversion]

jobs:
  convert_file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo gdex_docs_dsarch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout Repo rda_python_dsarch
        uses: actions/checkout@v4
        with:
          repository: NCAR/rda-python-dsarch
          path: dsarch
          # Use the branch passed in the payload, defaulting to 'main' if not provided
          ref: ${{ github.event.client_payload.branch || 'main' }}
      
      - name: Convert dsarch.usg
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pgrst -d ${{ github.workspace }}/docs/source -u dsarch/src/rda_python_dsarch/dsarch.usg -p dsarch/src/rda_python_dsarch/pg_arch.py
#          git config --global user.name "Workflow Bot"
#          git config --global user.email "workflow-bot@users.noreply.github.com"
#          git add ./docs/source/*.rst

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update automated files"
          branch: "automated-update-branch" # Local branch name
          base: "main"                      # Target branch
          title: "Automated File Update"
          body: "This PR was automatically generated by GitHub Actions."
