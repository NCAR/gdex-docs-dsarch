# work flow to convert dsarch.usg in repo rda_python_dsarch into docs/source/sections*.rst
on:
  repository_dispatch:
    types: [trigger-conversion]

jobs:
  convert_file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo gdex_docs_dsarch
        uses: actions/checkout@v4

      - name: Convert and Commit
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pgrst -d docs/source -u ${{ github.event.client_payload.usgfile }} -p ${{ github.event.client_payload.pyfile }}
          git config --global user.name "Workflow Bot"
          git add ./docs/source
          git commit -m "Converted dsarch.usg from Repo rda_python_dsarch"
          git push
