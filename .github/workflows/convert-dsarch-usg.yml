# work flow to convert dsarch.usg in repo rda_python_dsarch into docs/source/sections*.rst
on:
  repository_dispatch:
    types: [trigger-conversion]

jobs:
  convert_file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo gdex_docs_dsarch
        uses: actions/checkout@v4
        with:
          path: ./
      - name: Checkout Repo rda_python_dsarch
        uses: actions/checkout@v4
        with:
          repository: NCAR/rda-python-dsarch
          path: ./dsarch
          # Use the branch passed in the payload, defaulting to 'main' if not provided
          ref: ${{ github.event.client_payload.branch || 'main' }}
      - name: Convert and Commit
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pgrst -d docs/source -u dsarch/src/rda_python_dsarch/darch.usg -p dsarch/src/rda_python_dsarch/pg_arch.py
          git config --global user.name "Workflow Bot"
          git config --global user.email "workflow-bot@users.noreply.github.com"
          git add ./docs/source/*.rst
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Converted dsarch.usg from Repo rda_python_dsarch"
            git push
          fi
